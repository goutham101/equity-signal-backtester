services:
  db:
    image: postgres:16
    container_name: backtester-db
    environment:
      POSTGRES_USER: backtester
      POSTGRES_PASSWORD: backtester
      POSTGRES_DB: backtester
    # Host port 5433 so it doesn't clash with a local Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs schema.sql the first time the database is created.
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U backtester -d backtester"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
